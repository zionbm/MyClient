services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myclient
      POSTGRES_USER: myclient
      POSTGRES_PASSWORD: myclient
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myclient -d myclient"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      NODE_ENV: development
      CORE_PORT: 3000
      DATABASE_URL: postgresql://myclient:myclient@postgres:5432/myclient?schema=public
      DEFAULT_LOCALE: he-IL
      INTERNAL_API_SECRET: dev-internal-secret
      AUTH_PROVIDER: ${AUTH_PROVIDER:-mock}
      AI_BASE_URL: http://ai:3001
      VOICE_BASE_URL: http://voice:3002
      MOCK_FCM_PROVIDER: ${MOCK_FCM_PROVIDER:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_TRANSCRIPTION_MODEL: ${OPENAI_REALTIME_TRANSCRIPTION_MODEL:-gpt-live-transcribe}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-adminsdk.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/run/secrets/firebase-adminsdk.json:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      NODE_ENV: development
      AI_PORT: 3001
      MOCK_LLM_PROVIDER: ${MOCK_LLM_PROVIDER:-false}
      DEFAULT_LOCALE: he-IL
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-5-mini}
    ports:
      - "3001:3001"

  voice:
    build:
      context: .
      dockerfile: services/voice/Dockerfile
    environment:
      NODE_ENV: development
      VOICE_PORT: 3002
      MOCK_STT_PROVIDER: ${MOCK_STT_PROVIDER:-false}
      MOCK_TTS_PROVIDER: true
      DEFAULT_LOCALE: he-IL
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}
    ports:
      - "3002:3002"

  telephony:
    build:
      context: .
      dockerfile: services/telephony/Dockerfile
    environment:
      NODE_ENV: development
      TELEPHONY_PORT: 3003
      CORE_BASE_URL: http://core:3000
      VOICE_BASE_URL: http://voice:3002
      MOCK_PLIVO_PROVIDER: true
      DEFAULT_LOCALE: he-IL
      INTERNAL_API_SECRET: dev-internal-secret
    ports:
      - "3003:3003"
    depends_on:
      - core
      - voice

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      NODE_ENV: development
      WORKER_PORT: 3004
      CORE_BASE_URL: http://core:3000
      DEFAULT_LOCALE: he-IL
      INTERNAL_API_SECRET: dev-internal-secret
      WORKER_TASK_POLL_ENABLED: ${WORKER_TASK_POLL_ENABLED:-true}
      WORKER_TASK_POLL_INTERVAL_MS: ${WORKER_TASK_POLL_INTERVAL_MS:-30000}
      WORKER_TASK_BATCH_SIZE: ${WORKER_TASK_BATCH_SIZE:-20}
    ports:
      - "3004:3004"
    depends_on:
      - core

volumes:
  postgres-data:
